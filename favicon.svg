<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d2a"/>
      <stop offset="100%" stop-color="#1a2e2b"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b9080"/>
      <stop offset="100%" stop-color="#a8c5b8"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Top-left accent dot -->
  <circle cx="5" cy="5" r="1.5" fill="#6b9080" opacity="0.5"/>

  <!-- K -->
  <line x1="6" y1="8" x2="6" y2="24" stroke="url(#text)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="13" y2="8" stroke="url(#text)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="16" x2="13" y2="24" stroke="url(#text)" stroke-width="2" stroke-linecap="round"/>

  <!-- S -->
  <path d="M19 10 C19 10 25 9 25 13 C25 17 19 17 19 21 C19 25 26 24 26 24"
    fill="none" stroke="url(#text)" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>